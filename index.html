<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Եվելինայի հրավիրատոմս</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+Armenian:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ddd4cb;
      padding: 24px 16px;
      font-family: "Noto Serif Armenian", "Cormorant Garamond", serif;
    }

    .invitation {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 760px;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(245, 210, 215, 0.22) 0%, transparent 44%),
        radial-gradient(ellipse at 88% 92%, rgba(240, 205, 210, 0.24) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255, 252, 248, 0.6) 0%, transparent 74%),
        #faf8f4;
      padding: 52px 34px 42px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.16);
    }

    .invitation::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 2px solid #c9a962;
      pointer-events: none;
    }

    .invitation::after {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid #c9a962;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 36px;
      height: 36px;
      opacity: 0.75;
      z-index: 2;
    }

    .corner-tl {
      top: 20px;
      left: 20px;
      border-top: 2px solid #c9a962;
      border-left: 2px solid #c9a962;
    }

    .corner-tr {
      top: 20px;
      right: 20px;
      border-top: 2px solid #c9a962;
      border-right: 2px solid #c9a962;
    }

    .corner-bl {
      bottom: 20px;
      left: 20px;
      border-bottom: 2px solid #c9a962;
      border-left: 2px solid #c9a962;
    }

    .corner-br {
      bottom: 20px;
      right: 20px;
      border-bottom: 2px solid #c9a962;
      border-right: 2px solid #c9a962;
    }

    .flowers-top,
    .flowers-bottom {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .flowers-top {
      top: -18px;
      left: -28px;
      width: 210px;
      height: 210px;
      background:
        radial-gradient(circle at 28% 38%, rgba(245, 220, 225, 0.55) 0%, transparent 54%),
        radial-gradient(circle at 58% 28%, rgba(235, 205, 210, 0.45) 0%, transparent 48%),
        radial-gradient(circle at 42% 62%, rgba(225, 195, 200, 0.4) 0%, transparent 44%),
        radial-gradient(circle at 70% 55%, rgba(240, 225, 220, 0.35) 0%, transparent 40%);
      opacity: 0.65;
    }

    .flowers-bottom {
      bottom: -24px;
      right: -34px;
      width: 230px;
      height: 230px;
      background:
        radial-gradient(circle at 72% 62%, rgba(245, 220, 225, 0.55) 0%, transparent 54%),
        radial-gradient(circle at 38% 72%, rgba(235, 205, 210, 0.45) 0%, transparent 48%),
        radial-gradient(circle at 55% 42%, rgba(225, 195, 200, 0.4) 0%, transparent 44%),
        radial-gradient(circle at 25% 48%, rgba(240, 225, 220, 0.35) 0%, transparent 40%);
      opacity: 0.65;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #5a4338;
    }

    .title {
      font-family: "Cormorant Garamond", "Noto Serif Armenian", serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: #6f5244;
      margin-bottom: 6px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 18px 0 28px;
      color: #c9a962;
    }

    .divider-line {
      width: 72px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a962 20%, #c9a962 80%, transparent);
    }

    .divider-heart {
      font-size: 0.7rem;
      opacity: 0.85;
    }

    .intro {
      font-family: "Cormorant Garamond", "Noto Serif Armenian", serif;
      font-size: 1.08rem;
      font-weight: 400;
      font-style: italic;
      line-height: 1.85;
      letter-spacing: 0.02em;
      color: #6b5248;
      margin-bottom: 24px;
      padding: 0 14px;
    }

    .intro strong {
      font-weight: 600;
      font-style: normal;
      color: #8b6a5c;
    }

    .name-block {
      margin: 8px 0 26px;
      padding: 0 10px;
    }

    .name-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 14px;
      max-width: 280px;
      color: #c9a962;
    }

    .name-divider::before,
    .name-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201, 169, 98, 0.7));
    }

    .name-divider::after {
      background: linear-gradient(90deg, rgba(201, 169, 98, 0.7), transparent);
    }

    .name-divider span {
      font-size: 0.65rem;
      opacity: 0.8;
    }

    .name {
      font-family: "Cormorant Garamond", "Noto Serif Armenian", serif;
      font-size: 3.8rem;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.04em;
      line-height: 1.1;
      margin: 18px 0 10px;
      background: linear-gradient(
        160deg,
        #c4a4a0 0%,
        #b8928e 28%,
        #a8807c 52%,
        #c9ada8 78%,
        #d4bdb8 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 2px rgba(168, 128, 124, 0.15));
    }

    .name-divider-bottom {
      margin-top: 14px;
      margin-bottom: 0;
    }

    .subtitle {
      display: inline-block;
      font-family: "Cormorant Garamond", "Noto Serif Armenian", serif;
      font-size: 1rem;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      color: #907a6e;
      margin-top: 4px;
    }

    .details {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 28px 0;
      padding: 24px 18px;
      border-top: 1px solid rgba(201, 169, 98, 0.35);
      border-bottom: 1px solid rgba(201, 169, 98, 0.35);
      background: rgba(255, 255, 255, 0.18);
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: "Cormorant Garamond", "Noto Serif Armenian", serif;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      color: #5f4a40;
    }

    .detail-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(201, 169, 98, 0.45);
      background: rgba(255, 252, 248, 0.7);
      flex-shrink: 0;
    }

    .detail-row svg {
      width: 16px;
      height: 16px;
      stroke: #b8986a;
      fill: none;
      stroke-width: 1.4;
    }

    .detail-text {
      text-align: left;
      line-height: 1.3;
    }

    .detail-label {
      display: block;
      font-size: 0.72rem;
      font-style: italic;
      letter-spacing: 0.12em;
      color: #a0897c;
      margin-bottom: 2px;
    }

    .detail-value {
      font-size: 1.02rem;
      font-weight: 600;
      color: #5f4a40;
    }

    .closing {
      font-family: "Cormorant Garamond", "Noto Serif Armenian", serif;
      font-size: 1rem;
      font-style: italic;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.02em;
      color: #6b5248;
      margin: 24px 0 30px;
      padding: 0 16px;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #3cb56f 0%, #2a9d6a 100%);
      color: #fff;
      text-decoration: none;
      padding: 14px 30px;
      border-radius: 50px;
      font-family: "Noto Serif Armenian", "Cormorant Garamond", serif;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(42, 157, 106, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(42, 157, 106, 0.36);
    }

    .whatsapp-btn svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .footer-flourish {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 26px;
      color: #c9a962;
      font-size: 0.65rem;
      opacity: 0.85;
    }

    .footer-flourish::before,
    .footer-flourish::after {
      content: "";
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201, 169, 98, 0.6));
    }

    .footer-flourish::after {
      background: linear-gradient(90deg, rgba(201, 169, 98, 0.6), transparent);
    }
  </style>
</head>
<body>
  <div class="invitation">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="flowers-top"></div>
    <div class="flowers-bottom"></div>

    <div class="content">
      <h1 class="title">ՀՐԱՎԻՐԱՏՈՄՍ</h1>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-heart">&#9829;</span>
        <span class="divider-line"></span>
      </div>

      <p class="intro">
        Սիրով հրավիրում ենք ձեզ<br>
        մեր սիրելի <strong>Եվելինայի</strong> ծննդյան տոնակատարությանը
      </p>

      <div class="name">Եվելինա</div>
      <p class="subtitle">ծննդյան տոն</p>

      <div class="details">
        <div class="detail-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>26.08.2026</span>
        </div>
        <div class="detail-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>17:30</span>
        </div>
        <div class="detail-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>Ոսկե Ծիրան Ռեստորան</span>
        </div>
      </div>

      <p class="closing">
        Կլինի մեզ համար մեծ պատիվ տեսնել ձեզ<br>
        մեր տոնին
      </p>

      <button type="button" class="whatsapp-btn" id="confirmBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"></path>
        </svg>
        Հաստատել WhatsApp-ով
      </button>

      <div class="footer-flourish">&#9829;</div>
    </div>
  </div>

  <script>
    const PHONE = "37494697165";
    const MESSAGE =
      "Բարև! Հաստատում եմ իմ մասնակցությունը Եվելինայի ծննդյան տոնակատարությանը (26.08.2026, 17:30, Ոսկե Ծիրան Ռեստորան):";

    document.getElementById("confirmBtn").addEventListener("click", function () {
      const url = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(MESSAGE);
      window.open(url, "_blank");
    });
  </script>
</body>
</html>
